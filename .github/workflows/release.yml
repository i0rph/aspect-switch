name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test, package
        shell: pwsh
        run: ./build.ps1 -Test -Package
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --generate-notes --title "Aspect Switch $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
